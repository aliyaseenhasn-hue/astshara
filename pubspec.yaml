name: astshara
description: LawConnect - A professional legal platform connecting clients with lawyers in Iraq.
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management - keep the API compatible with the existing generated providers
  flutter_riverpod: 2.5.3
  riverpod_annotation: 2.5.3

  # Backend (Supabase)
  supabase_flutter: ^2.6.0
  storage_client: ^2.6.0

  # Navigation
  go_router: ^14.2.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: 1.1.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # UI & Utilities
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  intl: ^0.20.2
  logger: ^2.4.0
  google_fonts: ^6.3.3
  flutter_local_notifications: ^17.2.1
  audioplayers: ^6.1.0
  flutter_dotenv: ^5.2.1
  image_picker: ^1.1.2
  file_picker: ^10.3.8
  url_launcher: ^6.3.0
  web: ^1.1.1

  # Functional Programming & Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation - use a published generator compatible with Dart 3.13
  build_runner: ^2.5.4
  freezed: ^3.1.0
  riverpod_generator: 2.6.5
  json_serializable: ^6.9.5

  # Linting
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/app_icon.png
