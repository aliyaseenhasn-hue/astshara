name: Apply booking button visibility fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace floating action with fixed bottom action
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('lib/features/bookings/presentation/pages/create_booking_page.dart')
          s = p.read_text(encoding='utf-8')

          pattern = re.compile(
              r"(?ms)^    // زر الإجراء مثبت فوق المحتوى حتى يبقى ظاهراً في جميع الخطوات\.\n"
              r"    floatingActionButtonLocation: FloatingActionButtonLocation\.centerFloat,\n"
              r"    floatingActionButton: SafeArea\(.*?^    \),\n  \);",
          )

          replacement = '''    // شريط الإجراء ثابت أسفل الصفحة وليس داخل منطقة التمرير.
    bottomNavigationBar: SafeArea(
      minimum: const EdgeInsets.fromLTRB(20, 8, 20, 12),
      child: _BottomActions(
        step: _step,
        loading: state.isLoading,
        onContinue: _next,
        onBack: _step == 0
            ? null
            : () => setState(() => _step--),
      ),
    ),
  );'''

          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('Expected floating booking action block was not found')

          s = s.replace(
              'padding: const EdgeInsets.fromLTRB(20, 8, 20, 112),',
              'padding: const EdgeInsets.fromLTRB(20, 8, 20, 24),',
              1,
          )
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate source
        run: |
          set -euo pipefail
          grep -q "bottomNavigationBar: SafeArea(" lib/features/bookings/presentation/pages/create_booking_page.dart
          grep -q "_BottomActions(" lib/features/bookings/presentation/pages/create_booking_page.dart
          grep -q "fromLTRB(20, 8, 20, 24)" lib/features/bookings/presentation/pages/create_booking_page.dart
          if grep -q "floatingActionButton: SafeArea(" lib/features/bookings/presentation/pages/create_booking_page.dart; then
            echo "ERROR: floating action is still present"
            exit 1
          fi

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/bookings/presentation/pages/create_booking_page.dart
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix(ui): pin booking actions to bottom of page"
          git push origin HEAD:main
