name: Apply booking button visibility fix

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'fix(ui): make booking continue button always visible' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch booking action area
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('lib/features/bookings/presentation/pages/create_booking_page.dart')
          text = path.read_text(encoding='utf-8')
          old = '''    // مثبت أسفل الشاشة في جميع الخطوات
    bottomNavigationBar: _BottomActions(
      step: _step,
      loading: state.isLoading,
      onContinue: _next,
      onBack: _step == 0
          ? null
          : () => setState(() => _step--),
    ),'''
          new = '''    // زر الإجراء مثبت فوق المحتوى، ولا يعتمد على bottomNavigationBar.
    // هذا يضمن ظهوره في جميع خطوات إنشاء الحجز.
    floatingActionButtonLocation: FloatingActionButtonLocation.centerFloat,
    floatingActionButton: SafeArea(
      child: Padding(
        padding: const EdgeInsets.fromLTRB(20, 0, 20, 8),
        child: _BottomActions(
          step: _step,
          loading: state.isLoading,
          onContinue: _next,
          onBack: _step == 0
              ? null
              : () => setState(() => _step--),
        ),
      ),
    ),'''
          if old not in text:
              raise SystemExit('Expected booking action block was not found')
          text = text.replace(old, new, 1)
          text = text.replace('padding: const EdgeInsets.fromLTRB(20, 8, 20, 32),', 'padding: const EdgeInsets.fromLTRB(20, 8, 20, 112),', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate patch
        run: |
          set -euo pipefail
          grep -n "floatingActionButton" lib/features/bookings/presentation/pages/create_booking_page.dart
          grep -n "fromLTRB(20, 8, 20, 112)" lib/features/bookings/presentation/pages/create_booking_page.dart

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/bookings/presentation/pages/create_booking_page.dart
          if git diff --cached --quiet; then
            echo "No patch required."
            exit 0
          fi
          git commit -m "fix(ui): make booking continue button always visible"
          git push origin HEAD:main
