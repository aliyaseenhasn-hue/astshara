name: Apply booking button visibility fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch booking action area
        shell: bash
        run: python3 -c "from pathlib import Path; p=Path('lib/features/bookings/presentation/pages/create_booking_page.dart'); s=p.read_text(encoding='utf-8'); old='''    floatingActionButtonLocation: FloatingActionButtonLocation.centerFloat,\n    floatingActionButton: SafeArea(\n      minimum: const EdgeInsets.only(bottom: 8),\n      child: Padding(\n        padding: const EdgeInsets.symmetric(horizontal: 20),\n        child: _BottomActions(\n          step: _step,\n          loading: state.isLoading,\n          onContinue: _next,\n          onBack: _step == 0\n              ? null\n              : () => setState(() => _step--),\n        ),\n      ),\n    ),\n'''; new='''    bottomNavigationBar: SafeArea(\n      minimum: const EdgeInsets.fromLTRB(20, 8, 20, 12),\n      child: _BottomActions(\n        step: _step,\n        loading: state.isLoading,\n        onContinue: _next,\n        onBack: _step == 0\n            ? null\n            : () => setState(() => _step--),\n      ),\n    ),\n'''; assert old in s, 'Expected floating action block not found'; s=s.replace(old,new,1); s=s.replace('padding: const EdgeInsets.fromLTRB(20, 8, 20, 112),','padding: const EdgeInsets.fromLTRB(20, 8, 20, 24),',1); p.write_text(s,encoding='utf-8')"

      - name: Validate source
        run: |
          set -euo pipefail
          grep -q 'bottomNavigationBar: SafeArea(' lib/features/bookings/presentation/pages/create_booking_page.dart
          grep -q 'fromLTRB(20, 8, 20, 24)' lib/features/bookings/presentation/pages/create_booking_page.dart
          if grep -q 'floatingActionButton: SafeArea(' lib/features/bookings/presentation/pages/create_booking_page.dart; then
            echo 'ERROR: floating action is still present'
            exit 1
          fi

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/bookings/presentation/pages/create_booking_page.dart
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix(ui): pin booking actions to bottom of page'
          git push origin HEAD:main
