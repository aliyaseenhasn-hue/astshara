name: Apply booking button visibility fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch booking action area
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; import re; p=Path('lib/features/bookings/presentation/pages/create_booking_page.dart'); s=p.read_text(encoding='utf-8'); pattern=r'(?ms)^    // مثبت أسفل الشاشة في جميع الخطوات\\n    bottomNavigationBar: _BottomActions\\(\\n      step: _step,\\n      loading: state\\.isLoading,\\n      onContinue: _next,\\n      onBack: _step == 0\\n          \\? null\\n          : \\(\\) => setState\\(\\(\\) => _step--\\),\\n    \\),'; replacement='''    // زر الإجراء مثبت فوق المحتوى حتى يبقى ظاهراً في جميع الخطوات.\\n    floatingActionButtonLocation: FloatingActionButtonLocation.centerFloat,\\n    floatingActionButton: SafeArea(\\n      minimum: const EdgeInsets.only(bottom: 8),\\n      child: Padding(\\n        padding: const EdgeInsets.symmetric(horizontal: 20),\\n        child: _BottomActions(\\n          step: _step,\\n          loading: state.isLoading,\\n          onContinue: _next,\\n          onBack: _step == 0\\n              ? null\\n              : () => setState(() => _step--),\\n        ),\\n      ),\\n    ),'''; n,c=re.subn(pattern,replacement,s,count=1); assert c==1 or 'floatingActionButton: SafeArea(' in s, 'booking action block not found'; s=n.replace('padding: const EdgeInsets.fromLTRB(20, 8, 20, 32),','padding: const EdgeInsets.fromLTRB(20, 8, 20, 112),',1); p.write_text(s,encoding='utf-8')"

      - name: Validate source
        run: |
          set -euo pipefail
          grep -q "floatingActionButton: SafeArea(" lib/features/bookings/presentation/pages/create_booking_page.dart
          grep -q "FloatingActionButtonLocation.centerFloat" lib/features/bookings/presentation/pages/create_booking_page.dart
          grep -q "fromLTRB(20, 8, 20, 112)" lib/features/bookings/presentation/pages/create_booking_page.dart
          ! grep -q "bottomNavigationBar: _BottomActions" lib/features/bookings/presentation/pages/create_booking_page.dart

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/bookings/presentation/pages/create_booking_page.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(ui): make booking continue button always visible"
          git push origin HEAD:main
