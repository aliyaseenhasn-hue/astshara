name: Flutter CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create CI .env
        run: |
          cat > .env <<'EOF_ENV'
          SUPABASE_URL=https://ci-placeholder.supabase.co
          SUPABASE_ANON_KEY=ci-placeholder-anon-key
          EOF_ENV

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build web
        run: flutter build web --release --no-wasm-dry-run --base-href "/astshara/" --dart-define=SUPABASE_URL="https://ci-placeholder.supabase.co" --dart-define=SUPABASE_ANON_KEY="ci-placeholder-anon-key"
