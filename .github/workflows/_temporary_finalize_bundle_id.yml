name: Finalize iOS Bundle ID

on:
  push:
    branches:
      - chore/finalize-istishara-app-id

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace iOS bundle identifiers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ios/Runner.xcodeproj/project.pbxproj')
          s = p.read_text()
          old = 'com.example.astshara'
          new = 'com.istishara.app'
          if old not in s:
              raise SystemExit('Expected old bundle identifier was not found')
          p.write_text(s.replace(old, new))
          print('Replaced', s.count(old), 'bundle identifier references')
          PY

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ios/Runner.xcodeproj/project.pbxproj
          git diff --cached --quiet || git commit -m 'chore: set permanent iOS bundle identifier'
          git push
