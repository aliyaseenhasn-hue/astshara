name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env file for analyzer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "::error::SUPABASE_URL secret is missing in GitHub repository settings."
            exit 1
          fi
          if [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::SUPABASE_ANON_KEY secret is missing in GitHub repository settings."
            exit 1
          fi
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env

      - name: Analyze Dart and Flutter code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        run: flutter test

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env file from GitHub Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "::error::SUPABASE_URL secret is missing in GitHub repository settings."
            exit 1
          fi
          if [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::SUPABASE_ANON_KEY secret is missing in GitHub repository settings."
            exit 1
          fi
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Flutter web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PWA_VAPID_PUBLIC_KEY: ${{ secrets.PWA_VAPID_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PWA_VAPID_PUBLIC_KEY:-}" ]; then
            echo "::error::PWA_VAPID_PUBLIC_KEY secret is missing in GitHub repository settings."
            exit 1
          fi
          flutter clean
          flutter pub get
          flutter build web --release --no-wasm-dry-run --base-href "/astshara/" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=VAPID_PUBLIC_KEY="$PWA_VAPID_PUBLIC_KEY"
          test -f build/web/index.html
          test -f build/web/manifest.json
          test -f build/web/icons/Icon-192.png
          test -f build/web/icons/Icon-512.png
          test -f build/web/pwa_service_worker_v5.js
          grep -q "pwa_service_worker_v5.js" build/web/index.html
          echo "Flutter Web build verified:"
          du -sh build/web
          find build/web -maxdepth 2 -type f | sort | head -80

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Deployment is intentionally independent of the test/analyze job so a failing local widget test cannot leave the live Pages site at 404. Tests still run and report failures separately.
