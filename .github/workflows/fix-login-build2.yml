name: Login Parser Repair Runner

on:
  push:
    branches: [main]

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Repair
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/features/authentication/presentation/pages/login_page.dart')
          s = p.read_text()
          start = s.index('  @override\n  Widget build(BuildContext context) {')
          end = s.rindex('\n}')
          build = '''  @override
  Widget build(BuildContext context) {
    final scheme = Theme.of(context).colorScheme;
    final state = ref.watch(authControllerProvider);
    return Scaffold(
      backgroundColor: scheme.surface,
      body: SafeArea(
        child: Center(
          child: SingleChildScrollView(
            padding: const EdgeInsets.all(24),
            child: ConstrainedBox(
              constraints: const BoxConstraints(maxWidth: 520),
              child: Directionality(
                textDirection: TextDirection.rtl,
                child: Form(
                  key: _formKey,
                  child: Card(
                    elevation: 0,
                    child: Padding(
                      padding: const EdgeInsets.all(24),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.stretch,
                        children: [
                          Align(
                            alignment: Alignment.centerRight,
                            child: TextButton.icon(
                              onPressed: () => context.canPop() ? context.pop() : context.go('/'),
                              icon: const Icon(Icons.arrow_forward_rounded),
                              label: const Text('العودة'),
                            ),
                          ),
                          const SizedBox(height: 12),
                          const Icon(Icons.balance_rounded, size: 54),
                          const SizedBox(height: 14),
                          Text(
                            widget.isAdminLogin ? 'دخول الإدارة' : 'تسجيل الدخول',
                            textAlign: TextAlign.center,
                            style: const TextStyle(fontSize: 28, fontWeight: FontWeight.w900),
                          ),
                          const SizedBox(height: 8),
                          Text(
                            'أدخل رقم هاتفك العراقي لإتمام الدخول بأمان عبر Telegram.',
                            textAlign: TextAlign.center,
                            style: TextStyle(color: scheme.onSurfaceVariant),
                          ),
                          const SizedBox(height: 24),
                          TextFormField(
                            controller: _phoneController,
                            keyboardType: TextInputType.phone,
                            textDirection: TextDirection.ltr,
                            textAlign: TextAlign.left,
                            decoration: const InputDecoration(
                              labelText: 'رقم الهاتف العراقي',
                              hintText: '07xxxxxxxxx أو ٠٧xxxxxxxxx',
                              prefixIcon: Icon(Icons.phone_android_rounded),
                            ),
                            validator: (value) {
                              final phone = _normalizeDigits(value ?? '').replaceAll(RegExp(r'\\s+'), '');
                              final digits = phone.replaceFirst(RegExp(r'^\\+964|^00964|^964|^0'), '');
                              return RegExp(r'^7\\d{9}$').hasMatch(digits) ? null : 'أدخل رقم هاتف عراقي صحيح مثل 07701234567';
                            },
                          ),
                          const SizedBox(height: 16),
                          SizedBox(
                            height: 52,
                            child: ElevatedButton.icon(
                              onPressed: (_telegramStarting || state.isLoading) ? null : _telegramLogin,
                              icon: _telegramStarting
                                  ? const SizedBox(width: 20, height: 20, child: CircularProgressIndicator(strokeWidth: 2))
                                  : const Icon(Icons.send_rounded),
                              label: Text(_telegramStarting ? 'جارٍ فتح Telegram...' : 'تسجيل الدخول عبر Telegram'),
                            ),
                          ),
                          const SizedBox(height: 10),
                          OutlinedButton.icon(
                            onPressed: state.isLoading ? null : _googleLogin,
                            icon: const Icon(Icons.account_circle_outlined),
                            label: const Text('المتابعة باستخدام Google'),
                          ),
                          const SizedBox(height: 16),
                          TextButton(
                            onPressed: () => context.go('/signup'),
                            child: const Text('ليس لديك حساب؟ إنشاء حساب جديد'),
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              ),
            ),
          ),
        ),
      ),
    );
  }
'''
          p.write_text(s[:start] + build + s[end:])
      - name: Commit and clean up
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/authentication/presentation/pages/login_page.dart
          git commit -m "fix: repair login page parser structure"
          git rm .github/workflows/fix-login-build.yml .github/workflows/fix-login-build2.yml
          git commit -m "chore: remove temporary repair workflows"
          git push