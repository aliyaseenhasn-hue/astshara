<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="استشارة - منصة الاستشارات القانونية">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0B172A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="استشارة">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>استشارة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light dark; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; min-height: 100%;
      background: #0B172A; direction: rtl; overflow: hidden; overscroll-behavior: none;
    }
    body {
      font-family: 'Cairo', sans-serif; -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility; -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <script>
    (function () {
      function syncViewportHeight() {
        var height = window.visualViewport ? window.visualViewport.height : window.innerHeight;
        document.documentElement.style.height = height + 'px';
        document.body.style.height = height + 'px';
      }
      syncViewportHeight();
      window.addEventListener('resize', syncViewportHeight, { passive: true });
      window.addEventListener('orientationchange', function () {
        setTimeout(syncViewportHeight, 100);
      }, { passive: true });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', syncViewportHeight, { passive: true });
      }
    })();

    window.astsharaEnablePush = async function(vapidPublicKey) {
      if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return null;
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') return null;
      const registration = await navigator.serviceWorker.ready;
      let subscription = await registration.pushManager.getSubscription();
      if (!subscription) {
        const padding = '='.repeat((4 - vapidPublicKey.length % 4) % 4);
        const base64 = vapidPublicKey.replace(/-/g, '+').replace(/_/g, '/') + padding;
        const binary = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
        subscription = await registration.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: binary });
      }
      return JSON.stringify(subscription.toJSON());
    };

    window.astsharaDisablePush = async function() {
      if (!('serviceWorker' in navigator)) return false;
      const registration = await navigator.serviceWorker.ready;
      const subscription = await registration.pushManager.getSubscription();
      if (!subscription) return true;
      return subscription.unsubscribe();
    };

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        // Versioned filename forces installed PWAs to replace the stale v4 worker.
        navigator.serviceWorker.register('pwa_service_worker_v5.js', { scope: './' })
          .catch((error) => console.warn('PWA service worker registration failed:', error));
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
